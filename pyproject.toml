[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machiningfm"
version = "2.0.0"
description = "MachiningFM: Foundation Model + Classical Machining Physics + Few-shot Downstream Adaptation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "torch>=2.2",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
data = ["h5py>=3.10", "Pillow>=10.0", "openpyxl>=3.1", "pyarrow>=15.0"]
api = ["fastapi>=0.110", "pydantic>=2.6", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["machiningfm*", "machiningfm_v2*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
