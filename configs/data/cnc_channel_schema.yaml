{
  "version": "cnc-v1",
  "canonical_name_format": "source.component.quantity.axis.representation",
  "description": "Standard identity and structured characteristics for CNC sensor channels and derived features.",
  "attributes": {
    "source": [
      "unknown",
      "external_sensor",
      "machine_controller",
      "process_condition",
      "derived_feature"
    ],
    "component": [
      "unknown",
      "machine",
      "spindle",
      "tool",
      "workpiece",
      "table",
      "axis_drive",
      "motor",
      "fixture",
      "coolant",
      "environment"
    ],
    "quantity": [
      "unknown",
      "vibration",
      "acoustic_emission",
      "force",
      "torque",
      "current",
      "voltage",
      "power",
      "energy",
      "load",
      "sound",
      "temperature",
      "pressure",
      "flow",
      "position",
      "position_error",
      "velocity",
      "speed",
      "feed_rate",
      "depth_of_cut",
      "width_of_cut",
      "tool_diameter",
      "tool_wear",
      "surface_roughness"
    ],
    "axis": [
      "unknown",
      "none",
      "x",
      "y",
      "z",
      "u",
      "v",
      "w",
      "a",
      "b",
      "c",
      "radial",
      "axial",
      "tangential",
      "channel_0..channel_31"
    ],
    "representation": [
      "unknown",
      "raw",
      "actual",
      "command",
      "setpoint",
      "rms",
      "mean",
      "std",
      "min",
      "max",
      "peak",
      "peak_to_peak",
      "kurtosis",
      "skewness",
      "crest_factor",
      "spectrum",
      "energy"
    ]
  },
  "pretraining_policy": {
    "unknown_channels": "exclude",
    "derived_features": "register_but_exclude_from_raw_signal_pretraining",
    "label_and_scalar_condition_quantities": "exclude_from_raw_signal_pretraining",
    "dynamic_controller_conditions": "allow_as_time_series"
  },
  "examples": {
    "vibration_data:0": "external_sensor.unknown.vibration.x.raw",
    "signals_sensor/force_sensor_x": "external_sensor.unknown.force.x.raw",
    "signals_machine/force_axis_x": "machine_controller.axis_drive.force.x.actual",
    "signals_machine/torque_spindle": "machine_controller.spindle.torque.none.actual",
    "signals_machine/tool_position_y": "machine_controller.tool.position.y.actual",
    "signals_machine/position_control_deviation_axis_x": "machine_controller.axis_drive.position_error.x.actual",
    "vibration_x_rms": "derived_feature.unknown.vibration.x.rms",
    "virtual_spindle_vibration_x": "external_sensor.spindle.vibration.x.raw",
    "virtual_spindle_vibration_y": "external_sensor.spindle.vibration.y.raw",
    "virtual_spindle_vibration_z": "external_sensor.spindle.vibration.z.raw"
  }
}
