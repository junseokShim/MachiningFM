{
  "mode": "scratch_pretraining_real",
  "model_version": "machiningfm-small-all-numeric",
  "seed": 42,
  "device": "auto",
  "epochs": 200,
  "max_steps": null,
  "batch_size": 4,
  "num_workers": 0,
  "drop_last": false,
  "gradient_accumulation_steps": 16,
  "gradient_clip_norm": 1.0,
  "learning_rate": 0.0002,
  "weight_decay": 0.0001,
  "amp": true,
  "show_progress_bar": true,
  "console_log_interval": "epoch",
  "metrics_log_interval": "epoch",
  "early_stopping": {
    "enabled": true,
    "monitor": "mean_loss",
    "mode": "min",
    "patience": 5,
    "min_delta": 0.0001,
    "warmup_epochs": 2
  },
  "log_every_steps": 10,
  "checkpoint_every_steps": 2000,
  "checkpoint_dir": "outputs/checkpoints/full_pretrain_all_numeric",
  "metrics_log_path": "outputs/training_logs/full_pretrain_all_numeric_epoch.jsonl",
  "loss_weights": {
    "masked_signal": 1.0,
    "forecasting": 1.0,
    "cross_channel": 0.25
  },
  "data": {
    "manifest_path": "reports/manifest.parquet",
    "sequence_length": 512,
    "max_channels": 16,
    "latent_context_path": "outputs/latent_context/full_pretrain_all_numeric_latent_context.json",
    "windows_per_file": 2,
    "max_read_attempts": 128,
    "include_datasets": [
      "accraw",
      "cnc_machining",
      "cs_label_data",
      "edge_oti_2_v3",
      "just_cas_milling",
      "multivariate_time_series_data_of_milling_processes_with_varying_tool_wear_and_machine_tools",
      "qit_cemc",
      "t4000",
      "origin",
      "vdmp"
    ],
    "extensions": [".h5", ".hdf5", ".csv", ".txt", ".parquet", ".npy", ".npz"]
  },
  "model": {
    "name": "machiningfm-small-all-numeric",
    "channel_schema_version": "cnc-v1",
    "d_model": 1024,
    "num_layers": 20,
    "num_heads": 16,
    "ff_mult": 4,
    "patch_size": 32,
    "horizon": 64,
    "max_channels": 16,
    "channel_vocab_size": 4096,
    "max_conditions": 64,
    "text_vocab_size": 8192,
    "max_text_tokens": 64,
    "dropout": 0.1,
    "causal": false
  }
}
