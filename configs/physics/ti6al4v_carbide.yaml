# Physics parameters for Ti-6Al-4V with uncoated carbide tooling
# Ti-6Al-4V is a difficult-to-machine aerospace alloy with low thermal conductivity.
# These are literature values — actual parameters depend on tool geometry and coating.

material: Ti6Al4V
tool: carbide_uncoated

taylor:
  C: 80.0          # m/min — conservative; Ti6Al4V has poor machinability (low C)
  n: 0.22           # Speed exponent
  m: 0.15           # Feed exponent (generalized Taylor)
  p: 0.08           # Depth exponent (generalized Taylor)
  source: literature
  reference: "Ezugwu & Wang (1997), J. Materials Processing Technology, 68:262-274"

kienzle:
  kc_1_1_n_per_mm2: 2450.0   # N/mm² — high specific force for Ti6Al4V
  mc: 0.21
  source: literature
  reference: "Klocke (2011), Manufacturing Processes 1, Springer"

archard:
  wear_coefficient_k: 5.0e-4
  hardness_h_n_per_mm2: 3200.0    # N/mm² ≈ HV 326 for Ti-6Al-4V
  source: literature
  available: false
  note: "Disabled by default. Enable only when normal_force_n and sliding_distance_mm are in dataset."

usui:
  B1: 2.5e-5
  B2: 5000.0    # Higher thermal activation for Ti6Al4V (lower conductivity)
  source: literature
  available: false
  note: "Disabled by default. Enable only when cutting_temperature_k is measured."
